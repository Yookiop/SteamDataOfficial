# 3_random: WILLEKEURIGE games, minst ververste eerst (--mode random --weight-refreshes)
#           - streeftijd 12:35 NL
#
# GEEN `schedule:` IN DIT BESTAND, en dat is bewust. De timing komt uit de
# schedule-orchestratie (zie docs/schedule-orchestratie.md): die klok start dit
# bestand met een `workflow_dispatch`. Handmatig kan ook: Actions > Run workflow.
# Er staat dus nergens meer een GitHub-cron op deze taak.
#
# Dit is 1 van de 3 runs per dag. Het voorwerk (nieuwe games + releasedatums) is
# in alle drie hetzelfde:
#
#   1  1_most_popular.yml    streeftijd 20:35 NL  -> --mode popular
#   2  2_least_popular.yml   streeftijd 04:35 NL  -> --mode least-popular
#   3  3_random.yml          streeftijd 12:35 NL  -> --mode random --weight-refreshes
#
# De drie runs delen één concurrency-groep (`steam-data-fetch`, queue: max).
# Start je er twee kort na elkaar, dan gaat de eerste draaien en blijft de
# tweede `pending` staan tot de eerste klaar is - hij wordt NIET geannuleerd.
# Let dus op de som: met RUN_BUDGET_MIN=330 (5,5 uur) kan een dag met 3 runs
# maximaal ~16,5 uur werk zijn.
#
# Elke run doet drie dingen:
#  STAP 1  fetch_games_initial.py (geen --limit): alle nog onbekende appids uit
#          de officiele app-lijst ophalen. Dynamisch budget + elke 5 minuten
#          een checkpoint-commit en push, dus er kan hooguit ~5 min werk
#          verloren gaan; de volgende run gaat verder waar deze stopte.
#  STAP 2  fetch_games_initial_update_releases.py: de games in upcoming.jsonl
#          ("Coming soon" / "Q4 2026" / "2027") opnieuw controleren. Heeft
#          Steam nu een echte releasedatum, dan promoveert de game naar de
#          master (games.jsonl); anders wordt de ruwe datum + release_checked_at
#          bijgewerkt. Keyless (draait dus ook zonder API key).
#  STAP 3  fetch_new_game_info.py --mode random --weight-refreshes: de EIGEN
#          taak van deze run - willekeurige games, maar de MINST VAAK ververste
#          eerst (binnen elke groep willekeurig). Zo komt elke game op den duur
#          aan de beurt i.p.v. dat een uniforme steekproef steeds dezelfde
#          games pakt. Checkpoints net als stap 1.
#
# MAX. 1x PER DAG: een game die op dezelfde "run-dag" (UTC+2) al is ververst
# wordt overgeslagen, zodat de 3 runs van een NL-dag niet dezelfde games
# pakken.
#
# GEEN CSV'S IN DEZE RUN: er wordt alleen in de BRONbestanden (jsonl/json)
# gecommit. De CSV-tabellen staan in .gitignore (data/*.csv) en maak je lokaal
# met jsonl_to_table.py.
#
# Time budget: GitHub kapt een job na 360 min hard af, dus de run budgetteert
# zichzelf met RUN_BUDGET_MIN (=330 min = 5,5 uur wall-clock). Dat is een
# PLAFOND, geen vaste duur: is het voorwerk klaar of is er weinig te doen, dan
# stopt de run zelf eerder. MODE_MIN (=20) is het minimum dat
# voor de eigen taak (stap 3) wordt gereserveerd - zo draait die ook op een dag
# met veel nieuwe games -, RELEASES_MIN (=30) is het maximum voor stap 2 en
# COMMIT_MIN (=5) de reserve voor de slotcommit. Beide scripts stoppen zelf
# 5 min voor hun budget (--max-duration-minutes); die marge wordt in de stap
# zelf weer opgeteld (GRACE_MIN).
#
# Requires the GitHub secret "STEAM_API_KEY" (repo Settings > Secrets and
# variables > Actions) met je Steam Web API key
# (https://steamcommunity.com/dev/apikey).
#
# Handmatig testen: Actions > "3_random" > Run workflow.

name: 3_random

on:
  # Geen `schedule:` (zie de kop van dit bestand): de orchestrator start deze
  # taak, of jij doet het handmatig.
  workflow_dispatch: # handmatig / via de orchestrator: doet exact dezelfde run

permissions:
  contents: write # nodig om de data terug te pushen

env:
  RUN_BUDGET_MIN: "330" # wall-clock budget van de hele run (5,5 uur = plafond, geen vaste duur)
  RUN_SHUTDOWN_MIN: "5" # laatste minuten: alleen nog afronden
  MODE_MIN: "20"        # minimum dat voor de eigen taak (stap 3) overblijft
  RELEASES_MIN: "30"    # maximum voor stap 2 (releasedatums)
  COMMIT_MIN: "5"       # reserve voor de slotcommit

concurrency:
  # Eén schrijver tegelijk. De runs worden handmatig na elkaar gestart, dus
  # normaal raken ze elkaar niet; dit is de vangrail als er tóch iets overlapt
  # (twee starts kort na elkaar, een run die uitloopt). Ze werken namelijk op
  # bestanden en pushen naar dezelfde branch, en `git push` is geen merge: een
  # push vanaf een verouderd commit wordt geweigerd en deze workflow doet geen
  # pull/rebase - parallel draaien zou dus werk weggooien.
  #
  # queue: max = meerdere runs mogen in de wachtrij staan (max 100). Zonder
  # deze regel annuleert de nieuwste run de oudste wachtende (standaard
  # `queue: single`) - precies wat je niet wilt als er 3 dingen samenkomen.
  group: steam-data-fetch
  queue: max
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Wall-clock plafond van de job: RUN_BUDGET_MIN (330) + de slotcommit en
    # wat marge. GitHub kapt een job hard af na 360 min, dus hier is 355 de
    # hoogst haalbare waarde.
    timeout-minutes: 355
    env:
      # De `secrets`-context mag NIET in een `if:`-conditie, in `env` wel.
      # Zonder secret is de waarde leeg en slaat stap 1 zichzelf over.
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # De klok voor alle budgetten hieronder: het ECHTE startmoment van deze
      # run. NIET github.run_started_at gebruiken: dat is de aanmaak-/
      # wachtrijtijd (kan uren eerder liggen), waardoor een late run een
      # negatief budget ziet en alle stappen zichzelf overslaan.
      - name: Starttijd vastleggen (budgetklok)
        shell: bash
        run: echo "RUN_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"

      # Stap 1: nieuwe games ophalen via de keyed Web API (heeft de API key
      # nodig). Dynamisch budget: het hele run-budget min de afrondmarge en min
      # wat voor stap 2 en de eigen taak is gereserveerd. Het script stopt zelf
      # ~5 min voor die grens; live progress staat in de Actions-log.
      - id: bulk
        name: Stap 1 - nieuwe games ophalen (fetch_games_initial)
        if: ${{ env.STEAM_API_KEY != '' }}
        timeout-minutes: 300
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Checkpoints bevatten alleen de jsonl/json-bestanden: de CSV-tabellen
          # staan in .gitignore (data/*.csv) en worden lokaal gemaakt.
          commit_checkpoint() {
            git add data/
            if git diff --cached --quiet; then
              echo "[$(date -u +'%H:%M:%S')] no changes to commit"
            else
              git commit -q -m "data: checkpoint fetch_games_initial (UTC $(date -u +'%Y-%m-%d %H:%M'))"
              if git push -q origin HEAD:main; then
                echo "[$(date -u +'%H:%M:%S')] checkpoint committed + pushed"
              else
                echo "[$(date -u +'%H:%M:%S')] push failed - the next checkpoint will retry"
              fi
            fi
          }

          # GRACE_MIN is de marge die het script zelf al van zijn budget
          # aftrekt; die tellen we er hier weer bij op, zodat het echte werk op
          # het bedoelde moment stopt.
          GRACE_MIN=5
          start_epoch="${RUN_START_EPOCH:-$(date -u +%s)}"
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          bulk_min=$(( left_min - RELEASES_MIN - MODE_MIN + GRACE_MIN ))
          echo "> run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min | script-budget ${bulk_min} min (${RELEASES_MIN} min voor stap 2 + ${MODE_MIN} min voor de eigen taak gereserveerd)"

          if [ "$bulk_min" -le "$GRACE_MIN" ]; then
            echo "> Te weinig tijd over voor stap 1 - overgeslagen; de eigen taak draait hierna gewoon door."
            exit 0
          fi

          echo "> starting fetch_games_initial.py (no --limit, budget ${bulk_min} min) in the background..."
          python fetch_games_initial.py --key "$STEAM_API_KEY" --max-duration-minutes "$bulk_min" > fetch.log 2>&1 &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            sleep 330          # checkpoint every 5 minutes
            commit_checkpoint
            echo "--- last lines of fetch.log ---"
            tail -n 3 fetch.log
          done
          wait "$PID"
          status=$?
          commit_checkpoint
          echo "> fetch_games_initial.py finished (exit $status). Last lines of fetch.log:"
          tail -n 5 fetch.log
          # 'complete' = catalogus helemaal bijgewerkt, 'partial' = budget op.
          grep -E "RUN_STATUS=" fetch.log || true
          if [ "$status" -ne 0 ]; then
            echo "! fetch_games_initial.py ended with an error - see fetch.log above."
            exit "$status"
          fi

      # Stap 2: upcoming-games controleren en uitgebrachte games naar de master
      # promoveren ("Coming soon" -> echte datum). Keyless, dus deze stap draait
      # ook zonder API key. Maximaal RELEASES_MIN minuten; MODE_MIN en
      # COMMIT_MIN blijven gereserveerd. Promoties gaan direct naar de master en
      # upcoming.jsonl wordt aan het eind herschreven, dus 1 commit na afloop is
      # genoeg.
      - id: releases
        name: Stap 2 - upcoming promoveren naar de master (releasedatums)
        timeout-minutes: 45
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GRACE_MIN=5        # marge die het script zelf al van het budget aftrekt
          MIN_STEP_MIN=5     # minder dan dit over -> stap overslaan
          start_epoch="${RUN_START_EPOCH:-$(date -u +%s)}"
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          script_min=$(( left_min - MODE_MIN - COMMIT_MIN + GRACE_MIN ))
          if [ "$script_min" -gt $(( RELEASES_MIN + GRACE_MIN )) ]; then
            script_min=$(( RELEASES_MIN + GRACE_MIN ))
          fi
          echo "> run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min | script-budget ${script_min} min (max ${RELEASES_MIN} min + marge)"

          if [ "$script_min" -le "$MIN_STEP_MIN" ]; then
            echo "> Te weinig tijd over voor stap 2 - overgeslagen; de eigen taak draait hierna gewoon door."
            exit 0
          fi

          echo "> starting fetch_games_initial_update_releases.py --max-duration-minutes ${script_min}..."
          python fetch_games_initial_update_releases.py --max-duration-minutes "$script_min" > releases.log 2>&1
          status=$?
          echo "> fetch_games_initial_update_releases.py finished (exit $status). Last lines of releases.log:"
          tail -n 12 releases.log

          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -q -m "data: releasedatums bijgewerkt (UTC $(date -u +'%Y-%m-%d %H:%M'))"
            git push -q origin HEAD:main || echo "push failed - de slotcommit probeert het opnieuw"
          fi

          if [ "$status" -ne 0 ]; then
            echo "! fetch_games_initial_update_releases.py ended with an error - see releases.log above."
            exit "$status"
          fi

      # Stap 3: DE EIGEN TAAK van deze run. Krijgt alle tijd die na stap 1 + 2
      # over is, min COMMIT_MIN voor de slotcommit; het script stopt zelf 5 min
      # voor die grens (GRACE_MIN komt er hier weer bij). Is er te weinig tijd
      # over (< MIN_STEP_MIN), dan slaat de stap zichzelf over en pakt de
      # volgende run het op.
      - id: main
        name: Stap 3 - eigen taak (random, minst ververste eerst, --weight-refreshes)
        timeout-minutes: 345
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_checkpoint() {
            git add data/
            if git diff --cached --quiet; then
              echo "[$(date -u +'%H:%M:%S')] no changes to commit"
            else
              git commit -q -m "data: checkpoint fetch_new_game_info (UTC $(date -u +'%Y-%m-%d %H:%M'))"
              if git push -q origin HEAD:main; then
                echo "[$(date -u +'%H:%M:%S')] checkpoint committed + pushed"
              else
                echo "[$(date -u +'%H:%M:%S')] push failed - the next checkpoint will retry"
              fi
            fi
          }

          GRACE_MIN=5        # marge die het script zelf al van het budget aftrekt
          MIN_STEP_MIN=5     # minder dan dit over -> stap overslaan
          start_epoch="${RUN_START_EPOCH:-$(date -u +%s)}"
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          script_min=$(( left_min - COMMIT_MIN + GRACE_MIN ))
          echo "> 3/3 random | run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min (${COMMIT_MIN} min reserve voor de slotcommit) | script-budget ${script_min} min"

          if [ "$script_min" -le "$MIN_STEP_MIN" ]; then
            echo "> Te weinig tijd over voor de eigen taak (${script_min} min <= ${MIN_STEP_MIN} min) - overgeslagen; de volgende run pakt het op."
            exit 0
          fi

          # --weight-refreshes: de minst vaak ververste games eerst, binnen elke
          # groep willekeurig (zie de uitleg bovenin dit bestand).
          echo "> starting fetch_new_game_info.py --mode random --weight-refreshes --max-duration-minutes ${script_min} in the background..."
          python fetch_new_game_info.py --mode random --weight-refreshes --max-duration-minutes "$script_min" > extra.log 2>&1 &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            sleep 330          # checkpoint every 5 minutes
            commit_checkpoint
            echo "--- last lines of extra.log ---"
            tail -n 3 extra.log
          done
          wait "$PID"
          status=$?
          commit_checkpoint
          echo "> fetch_new_game_info.py finished (exit $status). Last lines of extra.log:"
          tail -n 10 extra.log
          if [ "$status" -ne 0 ]; then
            echo "! fetch_new_game_info.py ended with an error - see extra.log above."
            exit "$status"
          fi

      # Slot: de data committen. Alleen de BRONbestanden (jsonl/json); de
      # CSV-tabellen staan in .gitignore en maak je lokaal met jsonl_to_table.py.
      # Draait ook als een eerdere stap is misgegaan (if: always()).
      - name: Data committen (jsonl/json)
        id: commit
        if: always()
        timeout-minutes: 25
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes in data/ - nothing to commit."
          else
            git commit -m "data: 3_random (UTC $(date -u +'%Y-%m-%d %H:%M'))"
            git push origin HEAD:main
          fi

      # Slot-samenvatting. Nodig omdat de drie taakstappen allemaal
      # `continue-on-error: true` hebben: een mislukte stap laat de job dan
      # GROEN eindigen, en een stap die zichzelf overslaat wegens 'te weinig
      # tijd' is helemaal onzichtbaar. `outcome` is het resultaat VÓÓR
      # continue-on-error; staat daar 'failure' in, dan maakt deze stap de run
      # alsnog rood.
      - name: Samenvatting (wat deed deze run echt?)
        if: always()
        shell: bash
        run: |
          set -u
          echo "> run            : 3_random (streeftijd 12:35 NL, geen eigen cron)"
          echo "> gestart door   : ${{ github.event_name }} van ${{ github.actor }}"
          echo "> nieuwe games   : ${{ steps.bulk.outcome }} (${{ steps.bulk.conclusion }})"
          echo "> releasedata    : ${{ steps.releases.outcome }} (${{ steps.releases.conclusion }})"
          echo "> eigen taak     : ${{ steps.main.outcome }} (${{ steps.main.conclusion }})"
          echo "> data-commit    : ${{ steps.commit.outcome }} (${{ steps.commit.conclusion }})"
          echo "> totale looptijd: $(( $(date -u +%s) - ${RUN_START_EPOCH:-$(date -u +%s)} )) s"
          for r in "${{ steps.bulk.outcome }}" "${{ steps.releases.outcome }}" "${{ steps.main.outcome }}"; do
            if [ "$r" = "failure" ]; then
              echo "::error::Een taakstap is misgegaan terwijl de job groen bleef (continue-on-error). Zie de log van die stap hierboven."
              exit 1
            fi
          done
