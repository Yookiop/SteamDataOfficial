# 0_watchdog: controleert of de dagtaken echt gedraaid zijn en start ze anders
# zelf. Dit is de vangrail voor GitHub's planner, die "best effort" is: een
# geplande run kan uren te laat starten of zelfs HELEMAAL niet verschijnen
# (13-09-2026: een run van 19:40 NL kwam nergens terug, ook niet als wachtende).
# De watchdog mag zelf best laat zijn - hij kijkt of het WERK gedaan is, niet of
# het de juiste minuut was.
#
# Elke ~30 minuten (op :07 en :37, want het hele uur is het drukst):
#   voor elke dagtaak (elk workflowbestand met één cron van de vorm `M H * * *`):
#     mist = er is geen run gestart sinds (geplande tijd - 30 min)
#            EN nu is het >= geplande tijd + 60 min
#   -> dan start de watchdog die taak zelf met een `workflow_dispatch`.
#
# Mag dat zomaar? Ja: `workflow_dispatch` (en `repository_dispatch`) is de
# gedocumenteerde uitzondering op de regel dat het ingebouwde GITHUB_TOKEN geen
# nieuwe runs mag starten. Er is dus geen PAT en geen externe cron nodig.
#
# Rechten: `actions: write` (runs lezen + dispatchen) en `contents: read` (voor
# de checkout van watchdog_check.py). De watchdog raakt de data zelf niet aan.
#
# LET OP: eigen concurrency-groep. Zet hem NOOIT in `steam-data-fetch`, want dan
# staat hij achter een run van 4 uur in de wachtrij.
#
# De uitslag staat in de run-samenvatting (Actions > deze run > Summary).

name: 0_watchdog

on:
  schedule:
    # Elke 30 minuten, bewust op :07 en :37 (niet op het hele uur).
    - cron: "7,37 * * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch: # handmatig: dezelfde controle, start wat mist

permissions:
  actions: write # runs lezen + workflow_dispatch doen
  contents: read # checkout van watchdog_check.py

concurrency:
  group: watchdog # eigen groep, NIET steam-data-fetch (zie boven)
  queue: max
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dagtaken controleren en starten wat mist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          python3 watchdog_check.py --repo "$REPO" --token "$GH_TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"
