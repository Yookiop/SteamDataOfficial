# Steam data run: nieuwe games + extra info (3x per dag, ELKE run een EIGEN
# taak)
#
# Elke geplande run doet exact hetzelfde voorwerk en daarna een eigen taak:
#
#  STAP 1  fetch_games_initial.py (geen --limit): alle nog onbekende appids
#          uit de officiele app-lijst ophalen. Het script krijgt een
#          dynamisch budget (het hele run-budget min de afrondmarge en min
#          wat voor de eigen taak is gereserveerd) en stopt ZELF ~5 min voor
#          die grens (--max-duration-minutes), netjes afgerond (exit 0)
#          i.p.v. hard afgekapt. Tijdens de run wordt ELKE 5 MINUTEN een
#          checkpoint gecommit + gepusht, dus er kan hooguit ~5 min werk
#          verloren gaan. De volgende run gaat verder waar deze stopte.
#  STAP 2  fetch_games_initial_update_releases.py: de games in
#          upcoming.jsonl (nog niet uitgebracht: "Coming soon" / "Q4 2026" /
#          "2027") opnieuw controleren. Heeft Steam nu een echte
#          releasedatum, dan wordt de game GEPROMOVEERD naar de master
#          (games.jsonl); anders wordt de ruwe datum + release_checked_at
#          bijgewerkt. Keyless (draait dus ook zonder API key); krijgt
#          maximaal RELEASES_MIN minuten per run en houdt - net als de
#          extra-info-taak - de max-1x-per-dag-regel aan, zodat de 3 runs
#          van een dag niet dezelfde games pakken. Binnen de kandidaten gaat
#          de game met de OUDSTE release_checked_at eerst (eerlijke ronde):
#          een gecontroleerde game sluit achteraan aan, dus elke game komt
#          even vaak aan de beurt - geen random die iemand laat liggen.
#  STAP 3  fetch_new_game_info.py --mode <...>: ALLE resterende tijd van het
#          run-budget naar een selectie die per run verschilt:
#            - 23:00 UTC (01:00 NL) -> --mode popular: de MEEST populaire
#              games (nieuwste spelersaantal per appid uit
#              games_extra_info, anders games.jsonl);
#            - 07:00 UTC (09:00 NL) -> --mode least-popular: de MINST
#              populaire games (set met gemiddeld < 100 spelers; het
#              gemiddelde komt uit games.jsonl + games_extra_info.jsonl),
#              waarbij de minst vaak ververste games uit die set voorrang
#              krijgen;
#            - 15:00 UTC (17:00 NL) -> --mode random --weight-refreshes:
#              willekeurige games, maar de minst vaak ververste eerst
#              (binnen elke groep random), zodat elke game op den duur
#              aan de beurt komt.
#          Checkpoint-commit + push elke 5 minuten, precies als stap 1.
#
# MAX. 1x PER DAG: in ALLE runs wordt een game overgeslagen die op dezelfde
# "run-dag" al is ververst (kolom DataUpdatedAt; run-dag = UTC+2, zodat de 3
# runs van een NL-dag bij elkaar horen - ook in de winter). Zo wordt geen
# enkele game 2x op een dag ververst en gaat de tijd naar games die nog niet
# aan bod kwamen.
#
# GEEN CSV'S IN DEZE RUN: de workflow commit alleen de BRONbestanden (jsonl/
# json). De CSV-tabellen zijn puur voor de visualisaties: die maak je lokaal
# met jsonl_to_table.py en ze staan in .gitignore (data/*.csv). De fetch-logica
# leest de jsonl-bestanden rechtstreeks (via data_rotation.iter_lines), dus er
# is nergens een CSV voor nodig.
#
# Time budget (DYNAMIC, nothing hardcoded): dit is EEN job en GitHub kapt een
# job na 6 uur (360 min) hard af, dus de run budgetteert zichzelf.
# RUN_BUDGET_MIN (=330, zie env) is het wall-clock budget van de hele run;
# RUN_SHUTDOWN_MIN (=5) is het venster waarin alleen nog wordt afgerond.
# MAIN_MIN_MIN (=20) is het minimum dat voor stap 3 (de modus-taak) wordt
# gereserveerd (zodat de eigen taak ook op een dag met veel nieuwe games
# altijd draait), RELEASES_MIN (=30) is het maximum dat stap 2 aan
# releasedatums mag besteden en COMMIT_MIN (=5) is de reserve voor de
# slotcommit (git add/commit/push van de jsonl-bestanden). Beide scripts
# stoppen zelf 5 min voor hun eigen budget (--max-duration-minutes) en trekken
# daarna nog wat tijd uit voor het wegschrijven; die 5 min wordt in de stap
# zelf weer bij het scriptbudget opgeteld. Dank zij de 5-min-checkpoints
# verliest zelfs een harde job-timeout hooguit ~5 min werk.
#
# Requires the GitHub secret "STEAM_API_KEY" (repo Settings > Secrets and
# variables > Actions) with your Steam Web API key
# (https://steamcommunity.com/dev/apikey).
#
# Runs AUTOMATICALLY 3x per day: 01:00, 09:00 and 17:00 NL time (see the
# `on:` section below - GitHub cron runs in UTC and ignores DST, so the times
# shift 1 hour in the winter). You can always start an extra run by hand:
# Actions > "Nightly fetch new game info" > Run workflow (also from your
# phone) - met de input `mode` kies je dan zelf welke taak er draait. A run
# that is still busy is never cancelled - a new run waits for it (concurrency
# group). Every run lasts up to ~5,5 hours and resumes from the last
# checkpoint. This repo is PUBLIC, so Actions minutes are free.

name: Nightly fetch new game info

on:
  workflow_dispatch: # handmatig, via de Actions-tab (kan ook vanaf je telefoon)
    inputs:
      mode:
        description: "Welke taak na de nieuwe games? (auto = op basis van het UTC-uur)"
        type: choice
        options:
          - auto
          - popular
          - least-popular
          - random
        default: auto
  # 3x per dag: 01:00, 09:00 en 17:00 NL-tijd - ELK met een EIGEN taak.
  # ⚠️ GitHub cron draait in UTC en volgt GEEN zomertijd. Deze tijden zijn
  # gekozen voor de NL-zomertijd (CEST = UTC+2): 23:00/07:00/15:00 UTC =
  # 01:00/09:00/17:00 NL. In de winter (CET = UTC+1) schuift alles 1 uur op
  # naar 00:00/08:00/16:00 NL; de "run-dag" (UTC+2) blijft dan hetzelfde
  # drietal runs, dus de max-1x-per-dag-regel klopt in beide seizoenen.
  # Welke taak er draait wordt in de eerste stap uit het UTC-uur afgeleid:
  #   23:00 UTC -> popular        (01:00 NL)
  #   07:00 UTC -> least-popular  (09:00 NL)
  #   15:00 UTC -> random         (17:00 NL)
  # Let op:
  #  - Een schedule draait alleen als dít bestand op de DEFAULT branch (main)
  #    staat, niet op een feature branch.
  #  - GitHub kan scheduled runs overslaan/uitzetten na ~60 dagen zonder push
  #    in de repo (inactiviteitslimiet voor cron).
  #  - De drie runs zitten 8 uur uit elkaar; een run duurt max ~5,5 uur, dus
  #    ze overlappen elkaar niet.
  schedule:
    - cron: "0 23 * * *" # 01:00 NL -> meest populaire games
    - cron: "0 7 * * *"  # 09:00 NL -> minst populaire games
    - cron: "0 15 * * *" # 17:00 NL -> willekeurige games

permissions:
  contents: write # needed to push the data back

# Zelf opgelegd wall-clock budget voor de HELE run. GitHub kapt een job na
# 360 min hard af, dus de run plant zichzelf ruim daaronder:
#   RUN_BUDGET_MIN   = totale budget van de run in minuten
#   RUN_SHUTDOWN_MIN = laatste minuten die alleen voor afronden zijn
#   MAIN_MIN_MIN     = minimum dat voor de modus-taak (stap 3) wordt
#                      gereserveerd, ook als stap 1/2 het budget bijna
#                      opsoupeert: zo draait elke run echt zijn eigen taak
#   RELEASES_MIN     = maximum dat stap 2 (releasedatums bijwerken) per run
#                      mag gebruiken; 0 = stap overslaan
#   COMMIT_MIN       = reserve voor de slotcommit (git add/commit/push van de
#                      jsonl-bestanden)
# Beide scripts stoppen zelf al 5 min vóór hun eigen budget
# (--max-duration-minutes, GRACEFUL_STOP_MARGIN_MINUTES) en trekken daarna
# nog ~1-3 min uit voor het wegschrijven (master/CSV's); daarom komt die 5
# min in de stap zelf weer bij het scriptbudget op. Zo wordt er nooit midden
# in een regel afgebroken.
env:
  RUN_BUDGET_MIN: "330"
  RUN_SHUTDOWN_MIN: "5"
  MAIN_MIN_MIN: "20"
  RELEASES_MIN: "30"
  COMMIT_MIN: "5"

# Never run two runs at the same time; a running run is not cancelled, a
# new one waits.
concurrency:
  group: nightly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # Hard cap of a GitHub-hosted job is 360 min. Stap 1
                         # krijgt RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN -
                         # MAIN_MIN_MIN minuten; stap 2 krijgt de tijd die
                         # daarna OVER is (min COMMIT_MIN voor de slotcommit).
                         # De 5-min-checkpoints in beide stappen betekenen dat
                         # een harde job-timeout hooguit ~5 min werk kost.
    # API key as job-level env var: the `secrets` context is NOT allowed in
    # an `if:` condition (GitHub error "Unrecognized named-value:
    # 'secrets'"), but it IS allowed in `env`. env.STEAM_API_KEY makes the
    # step conditional anyway; without the secret the value is empty -> the
    # step is skipped.
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Welke taak doet DEZE run? De 3 crons zijn in de workflow-context niet
      # van elkaar te onderscheiden, dus leiden we de modus af uit het
      # UTC-uur (23 -> popular, 7 -> least-popular, 15 -> random). Een
      # handmatige run kan de modus met de input `mode` zelf kiezen; `auto`
      # valt terug op het UTC-uur.
      - id: mode
        name: Bepaal de taak van deze run (popular / least-popular / random)
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ github.event.inputs.mode }}"
          hour=$(date -u +%H)
          hour=$((10#$hour))
          if [ -n "$requested" ] && [ "$requested" != "auto" ]; then
            mode="$requested"
            echo "> handmatige keuze: modus = $mode"
          else
            case "$hour" in
              23) mode="popular" ;;        # 01:00 NL
              7)  mode="least-popular" ;;  # 09:00 NL
              15) mode="random" ;;         # 17:00 NL
              *)  mode="popular" ;;        # handmatig op een ander uur
            esac
            echo "> UTC-uur $hour -> modus = $mode"
          fi
          # De "run-dag" (UTC+2): de 3 runs van een NL-dag horen bij elkaar.
          run_day="$(date -u -d '+2 hours' +%Y-%m-%d)"
          echo "> run-dag: $run_day"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "run_day=$run_day" >> "$GITHUB_OUTPUT"

      # Stap 1: nieuwe games ophalen via de keyed Web API (heeft de API key
      # nodig). Het budget is DYNAMISCH: het hele run-budget min de
      # afrondmarge en min MAIN_MIN_MIN (dat is gereserveerd voor stap 2,
      # zodat elke run echt zijn eigen taak doet). Zoals altijd stopt het
      # script zelf ~5 min voor die grens en wordt er elke 5 minuten een
      # checkpoint gecommit + gepusht. Live progress staat in de Actions-log
      # (heartbeat + logregels).
      - id: bulk
        name: Nieuwe games ophalen (fetch_games_initial, dynamisch budget)
        if: ${{ env.STEAM_API_KEY != '' }}
        timeout-minutes: 335
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Checkpoints bevatten alleen de jsonl/json-bestanden: de CSV-tabellen
          # staan in .gitignore (data/*.csv) en worden lokaal gemaakt.
          commit_checkpoint() {
            git add data/
            if git diff --cached --quiet; then
              echo "[$(date -u +'%H:%M:%S')] no changes to commit"
            else
              git commit -q -m "data: checkpoint fetch_games_initial (UTC $(date -u +'%Y-%m-%d %H:%M'))"
              if git push -q origin HEAD:main; then
                echo "[$(date -u +'%H:%M:%S')] checkpoint committed + pushed"
              else
                echo "[$(date -u +'%H:%M:%S')] push failed - the next checkpoint will retry"
              fi
            fi
          }

          # ---- dynamisch tijdsbudget voor deze stap ---------------------- #
          # Het hele run-budget min de afrondmarge, min RELEASES_MIN (stap 2)
          # en MAIN_MIN_MIN (stap 3). GRACE_MIN is de marge die het script zelf
          # al van zijn budget aftrekt; die tellen we er hier weer bij op, zodat
          # het echte werk op het bedoelde moment stopt.
          GRACE_MIN=5
          start_epoch=$(date -u -d "${{ github.run_started_at }}" +%s)
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          bulk_min=$(( left_min - MAIN_MIN_MIN - RELEASES_MIN + GRACE_MIN ))
          echo "> run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min | script-budget ${bulk_min} min (${RELEASES_MIN} min voor stap 2 + ${MAIN_MIN_MIN} min voor de modus-taak gereserveerd)"

          if [ "$bulk_min" -le "$GRACE_MIN" ]; then
            echo "> Te weinig tijd over voor stap 1 - overgeslagen; de modus-taak draait hierna gewoon door."
            exit 0
          fi

          echo "> starting fetch_games_initial.py (no --limit, budget ${bulk_min} min) in the background..."
          python fetch_games_initial.py --key "$STEAM_API_KEY" --max-duration-minutes "$bulk_min" > fetch.log 2>&1 &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            sleep 330          # checkpoint every 5 minutes
            commit_checkpoint
            echo "--- last lines of fetch.log ---"
            tail -n 3 fetch.log
          done
          wait "$PID"
          status=$?
          commit_checkpoint
          echo "> fetch_games_initial.py finished (exit $status). Last lines of fetch.log:"
          tail -n 5 fetch.log
          # De modus-taak hierna bepaalt zelf of er nog tijd genoeg is; de
          # RUN_STATUS-regel uit het script blijft nuttige info voor de log
          # ('complete' = catalogus helemaal bijgewerkt, 'partial' = budget op).
          grep -E "RUN_STATUS=" fetch.log || true
          if [ "$status" -ne 0 ]; then
            echo "! fetch_games_initial.py ended with an error - see fetch.log above."
            exit "$status"
          fi

      # Stap 2: upcoming-games controleren en uitgebrachte games naar de
      # master promoveren ("Coming soon" -> echte datum). Keyless, dus deze
      # stap draait ook zonder API key. Hij krijgt maximaal RELEASES_MIN
      # minuten; MAIN_MIN_MIN + COMMIT_MIN blijven gereserveerd voor de
      # modus-taak en de slotcommit. Het script houdt dezelfde max-1x-per-dag-
      # regel aan als de extra-info-taak en werkt de kandidaten op oudste
      # release_checked_at eerst af (eerlijke ronde). Promoties worden direct
      # aan de master toegevoegd en upcoming.jsonl wordt aan het eind
      # herschreven, dus één commit na afloop is genoeg (tussentijdse
      # checkpoints zouden niets opleveren).
      - id: releases
        name: Upcoming-games promoveren naar de master (releasedatums)
        timeout-minutes: 60
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          GRACE_MIN=5        # marge die het script zelf al van het budget aftrekt
          MIN_STEP_MIN=5     # minder dan dit over -> stap overslaan
          start_epoch=$(date -u -d "${{ github.run_started_at }}" +%s)
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          script_min=$(( left_min - MAIN_MIN_MIN - COMMIT_MIN + GRACE_MIN ))
          if [ "$script_min" -gt $(( RELEASES_MIN + GRACE_MIN )) ]; then
            script_min=$(( RELEASES_MIN + GRACE_MIN ))
          fi
          echo "> run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min | script-budget ${script_min} min (max ${RELEASES_MIN} min + marge)"

          if [ "$script_min" -le "$MIN_STEP_MIN" ]; then
            echo "> Te weinig tijd over voor stap 2 - overgeslagen; de modus-taak draait hierna gewoon door."
            exit 0
          fi

          echo "> starting fetch_games_initial_update_releases.py --max-duration-minutes ${script_min}..."
          python fetch_games_initial_update_releases.py --max-duration-minutes "$script_min" > releases.log 2>&1
          status=$?
          echo "> fetch_games_initial_update_releases.py finished (exit $status). Last lines of releases.log:"
          tail -n 12 releases.log

          git add data/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -q -m "data: releasedatums bijgewerkt (UTC $(date -u +'%Y-%m-%d %H:%M'))"
            git push -q origin HEAD:main || echo "push failed - de slotcommit probeert het opnieuw"
          fi

          if [ "$status" -ne 0 ]; then
            echo "! fetch_games_initial_update_releases.py ended with an error - see releases.log above."
            exit "$status"
          fi

      - id: main
        name: Modus-taak (popular / least-popular / random, dynamisch budget)
        # Draait ALTIJD (los van het resultaat van stap 1 en 2): de modus-taak
        # krijgt alle tijd die na stap 1 + 2 nog over is, min COMMIT_MIN voor
        # de slotcommit. De modus komt uit de eerste stap
        # (23:00 UTC = popular, 07:00 UTC = least-popular, 15:00 UTC =
        # random); de input `mode` van een handmatige run gaat voor.
        #
        # Dynamisch budget: (run-budget - afrondmarge - al gebruikt) min
        # COMMIT_MIN; het script stopt zelf 5 min voor die grens en die marge
        # wordt hier weer opgeteld (GRACE_MIN). Is er te weinig tijd over
        # (< MIN_STEP_MIN), dan slaat de stap zichzelf over en pakt de
        # volgende run het op. Zoals in stap 1 elke 5 minuten een checkpoint.
        timeout-minutes: 340
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Checkpoints bevatten alleen de jsonl/json-bestanden: de CSV-tabellen
          # staan in .gitignore (data/*.csv) en worden lokaal gemaakt.
          commit_checkpoint() {
            git add data/
            if git diff --cached --quiet; then
              echo "[$(date -u +'%H:%M:%S')] no changes to commit"
            else
              git commit -q -m "data: checkpoint fetch_new_game_info (UTC $(date -u +'%Y-%m-%d %H:%M'))"
              if git push -q origin HEAD:main; then
                echo "[$(date -u +'%H:%M:%S')] checkpoint committed + pushed"
              else
                echo "[$(date -u +'%H:%M:%S')] push failed - the next checkpoint will retry"
              fi
            fi
          }

          # ---- dynamisch tijdsbudget voor deze stap ---------------------- #
          MODE="${{ steps.mode.outputs.mode }}"
          GRACE_MIN=5        # marge die het script zelf al van het budget aftrekt
          MIN_STEP_MIN=5     # minder dan dit over -> stap overslaan
          start_epoch=$(date -u -d "${{ github.run_started_at }}" +%s)
          now_epoch=$(date -u +%s)
          elapsed_min=$(( (now_epoch - start_epoch) / 60 ))
          left_min=$(( RUN_BUDGET_MIN - RUN_SHUTDOWN_MIN - elapsed_min ))
          script_min=$(( left_min - COMMIT_MIN + GRACE_MIN ))
          echo "> modus: ${MODE} | run-budget ${RUN_BUDGET_MIN} min | al gebruikt ~${elapsed_min} min | nog ${left_min} min (${COMMIT_MIN} min reserve voor de slotcommit) | script-budget ${script_min} min"

          if [ "$script_min" -le "$MIN_STEP_MIN" ]; then
            echo "> Te weinig tijd over voor de modus-taak (${script_min} min <= ${MIN_STEP_MIN} min) - overgeslagen; de volgende run pakt het op."
            exit 0
          fi

          # Bij de random-taak (17:00 NL) wegen we op het aantal keren dat een
          # game al is ververst: de minst vaak ververste games eerst, binnen
          # elke groep willekeurig. Zo komt elke game op den duur aan de beurt
          # i.p.v. dat een uniforme steekproef steeds dezelfde games pakt.
          WEIGHT_ARGS=""
          if [ "$MODE" = "random" ]; then
            WEIGHT_ARGS="--weight-refreshes"
          fi

          echo "> starting fetch_new_game_info.py --mode ${MODE} ${WEIGHT_ARGS} --max-duration-minutes ${script_min} in the background..."
          python fetch_new_game_info.py --mode "$MODE" $WEIGHT_ARGS --max-duration-minutes "$script_min" > extra.log 2>&1 &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            sleep 330          # checkpoint every 5 minutes
            commit_checkpoint
            echo "--- last lines of extra.log ---"
            tail -n 3 extra.log
          done
          wait "$PID"
          status=$?
          commit_checkpoint
          echo "> fetch_new_game_info.py finished (exit $status). Last lines of extra.log:"
          tail -n 10 extra.log
          if [ "$status" -ne 0 ]; then
            echo "! fetch_new_game_info.py ended with an error - see extra.log above."
            exit "$status"
          fi

      # Slot: de data committen. Alleen de BRONbestanden (jsonl/json); de
      # CSV-tabellen staan in .gitignore en maak je lokaal met
      # jsonl_to_table.py (voor de visualisaties). Draait ook als een eerdere
      # stap is misgegaan (if: always()).
      - name: Data committen (jsonl/json)
        if: always()
        timeout-minutes: 30
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes in data/ - nothing to commit."
          else
            git commit -m "data: Steam data run (UTC $(date -u +'%Y-%m-%d %H:%M'))"
            git push origin HEAD:main
          fi
