# Steam-data-run: bulk-catalogus + extra info
#
#  1. fetch_games_initial.py (ZONDER --limit): alle nog onbekende appids uit
#     de officiele app-lijst verwerken tot games.jsonl compleet is. De job-
#     limiet is 6 uur, dus deze stap committed en pusht ELKE 5 MINUTEN een
#     checkpoint (data/). Wordt de job na 6 uur afgebroken, dan staat de
#     voortgang al op GitHub en pakt een volgende (handmatige) run gewoon
#     verder op. Zodra alles doorlopen is, is deze stap in een paar minuten
#     klaar ("geen nieuwe games") en loopt de rest gewoon door.
#  2. fetch_new_game_info.py --limit 50 --random: extra momentopnamen +
#     reviews (data/games_extra_info.jsonl + reviews bijwerken games.jsonl).
#
# Vereist: GitHub Secret "STEAM_API_KEY" (repo Settings > Secrets and
# variables > Actions) met je Steam Web API key
# (https://steamcommunity.com/dev/apikey).
#
# Handmatig starten: Actions > "Nightly fetch new game info" > Run workflow.

name: Nightly fetch new game info

on:
  schedule:
    # Elke nacht 03:00 UTC (= 05:00 NL zomertijd / 04:00 NL wintertijd)
    - cron: "0 3 * * *"
  workflow_dispatch: # handmatig starten via de Actions-tab

permissions:
  contents: write # nodig om de data terug te kunnen pushen

# Zorg dat nooit twee runs tegelijk draaien (bijv. handmatig + gepland);
# een draaiende run wordt niet afgebroken, een nieuwe wacht.
concurrency:
  group: nightly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # max. looptijd van een GitHub-hosted job
    # De API key als job-level env-var: de `secrets`-context mag NIET in een
    # `if:`-conditie (GitHub-fout "Unrecognized named-value: 'secrets'"),
    # maar wél in `env`. Via env.STEAM_API_KEY kan de stap tóch
    # conditioneel draaien. Zonder secret is de waarde leeg -> stap skipped.
    env:
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nieuwe games toevoegen via de keyed Web API (heeft de API key nodig).
      # ZONDER --limit -> duurt langer dan de job-limiet, dus wordt er elke
      # 5 minuten een checkpoint gecommit + gepusht (data/). Zo overleeft
      # een afgebroken run (6u-limiet) en kun je elke checkpoint op GitHub
      # zien; een herstart pakt op waar de laatste checkpoint stopte. De
      # live voortgang staat in de Actions-log (heartbeat + logregels).
      - name: Nieuwe games ophalen (bulk, checkpoints om de 5 min)
        if: ${{ env.STEAM_API_KEY != '' }}
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_checkpoint() {
            git add data/
            if git diff --cached --quiet; then
              echo "[$(date -u +'%H:%M:%S')] geen nieuwe wijzigingen"
            else
              git commit -q -m "data: checkpoint fetch_games_initial (UTC $(date -u +'%Y-%m-%d %H:%M'))"
              if git push -q origin HEAD:main; then
                echo "[$(date -u +'%H:%M:%S')] checkpoint gecommit + gepusht"
              else
                echo "[$(date -u +'%H:%M:%S')] push mislukt - volgende checkpoint probeert opnieuw"
              fi
            fi
          }

          echo "> fetch_games_initial.py (zonder --limit) starten in de achtergrond..."
          python fetch_games_initial.py --key "$STEAM_API_KEY" > fetch.log 2>&1 &
          PID=$!

          while kill -0 "$PID" 2>/dev/null; do
            sleep 300          # checkpoint om de 5 minuten
            commit_checkpoint
            echo "--- laatste regels fetch.log ---"
            tail -n 3 fetch.log
          done
          wait "$PID"
          status=$?
          commit_checkpoint
          echo "> fetch_games_initial.py klaar (exit $status). Laatste regels fetch.log:"
          tail -n 5 fetch.log
          if [ "$status" -ne 0 ]; then
            echo "! fetch_games_initial.py eindigde met een fout - zie fetch.log hierboven."
            exit "$status"
          fi

      - name: Extra info per game
        run: python fetch_new_game_info.py --limit 25000 --random

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in data/ - niets te committen."
          else
            git commit -m "data: nightly Steam data run (new games + extra info, UTC $(date -u +'%Y-%m-%d %H:%M'))"
            git push origin HEAD:main
          fi
