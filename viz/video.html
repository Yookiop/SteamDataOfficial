<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steam video charts</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header>
  <h1>Steam video charts</h1>
  <p class="sub">Five animated video visuals from the data in <code>data/</code> — <span id="dataInfo">Loading…</span></p>
</header>

<main>

  <section class="card">
    <div class="card-head">
      <h2 id="chartTitle">Genre map</h2>
      <span id="recBadge" class="badge" hidden>⏺ Recording…</span>
    </div>

    <div class="controls">
      <span class="chips" id="chips">
        <button class="btn active" data-chart="map">Genre map</button>
        <button class="btn" data-chart="spiral">Release spiral</button>
        <button class="btn" data-chart="f2p">Free-to-play</button>
        <button class="btn" data-chart="indie">Indie takeover</button>
        <button class="btn" data-chart="players">Player funnel</button>
      </span>
      <button id="playBtn" class="btn" title="Play / pause">▶ Play</button>
      <button id="restartBtn" class="btn" title="Restart from the beginning">⟲ Restart</button>
      <label class="dur" for="durSlider">Duration
        <input type="range" id="durSlider" min="10" max="120" step="5" value="60">
        <output id="durVal" for="durSlider">60</output> s
      </label>
      <button id="exportBtn" class="btn primary" title="Record one full cycle and download it as MP4">
        ⬇ Export MP4
      </button>
      <span id="exportStatus" class="status" hidden></span>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="1600" height="900"></canvas>
    </div>

    <p class="hint" id="hint">…</p>
  </section>

</main>

<script src="static/video.js"></script>
</body>
</html>
